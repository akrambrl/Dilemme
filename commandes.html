<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commandes du jour — Dilemme</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141D16">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/fonts.css?v=86a2b68b">
<link rel="stylesheet" href="assets/css/styles.css?v=cf478dc4">
<style>
  /* Écran de caisse : lisible à un mètre, utilisable d'une main. */
  .caisse { max-width: 900px; margin-inline: auto; padding: 16px 16px 120px; }

  .caisse__head {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .caisse__head img { width: 42px; height: 42px; border-radius: 50%; flex: none; }
  .caisse__head h1 { margin: 0; font-size: 1.35rem; }
  .caisse__head p { margin: 2px 0 0; color: var(--ink-soft); font-size: .82rem; }

  .pastille {
    flex: none;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px;
    font-size: .78rem; font-weight: 600;
    background: var(--sage-100); color: var(--sage-900);
  }
  .pastille__point {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--sage-500);
  }
  .pastille--alerte { background: var(--brick-100); color: var(--brick-600); }
  .pastille--alerte .pastille__point { background: var(--brick-600); }

  .onglets { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .onglets button {
    border: 1px solid var(--line); background: var(--paper);
    border-radius: 999px; padding: 8px 16px;
    font: inherit; font-size: .86rem; cursor: pointer;
  }
  .onglets button[aria-pressed="true"] {
    background: var(--sage-500); border-color: var(--sage-500); color: #fff; font-weight: 600;
  }

  .cmd {
    border: 1px solid var(--line); border-left: 5px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--paper);
    padding: 16px; margin-bottom: 14px;
  }
  .cmd--nouvelle { border-left-color: var(--brick-600); background: var(--brick-100); }
  .cmd--vue { border-left-color: var(--sage-500); }
  .cmd--prete { border-left-color: var(--sage-300); opacity: .7; }
  .cmd--annulee { opacity: .5; }
  .cmd--annulee .cmd__lignes { text-decoration: line-through; }

  .cmd__head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .cmd__ref { font-weight: 700; font-size: 1.05rem; }
  .cmd__heure { font-size: 1.35rem; font-weight: 700; margin-left: auto; }
  .cmd__client { color: var(--ink-soft); font-size: .9rem; margin: 0 0 12px; }
  .cmd__client a { color: inherit; text-decoration: underline; }

  .cmd__lignes { margin: 0 0 12px; padding: 0; list-style: none; }
  .cmd__lignes > li { padding: 7px 0; border-top: 1px solid var(--line); }
  .cmd__lignes > li:first-child { border-top: 0; }
  .cmd__qte {
    display: inline-block; min-width: 30px;
    font-weight: 700; color: var(--sage-700);
  }
  .cmd__opts { margin: 3px 0 0 30px; color: var(--ink-soft); font-size: .84rem; }
  .cmd__opts span { display: block; }

  .cmd__pied { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cmd__total { font-weight: 700; margin-right: auto; }
  .cmd__note {
    background: var(--amber-100, #FBF3E2); border-radius: var(--radius-sm);
    padding: 9px 12px; margin: 0 0 12px; font-size: .9rem;
  }

  .etiq {
    display: inline-block; padding: 3px 9px; border-radius: 999px;
    font-size: .72rem; font-weight: 600; letter-spacing: .04em;
    background: var(--sage-100); color: var(--sage-900);
  }
  .etiq--alerte { background: var(--brick-600); color: #fff; }
  .etiq--muet { background: var(--line); color: var(--ink-soft); }

  .vide { text-align: center; padding: 60px 20px; color: var(--ink-soft); }

  .connexion { max-width: 380px; margin: 12vh auto; padding: 0 20px; text-align: center; }

  /* Sur téléphone, l'en-tête doit tenir sur une ligne : le logo cède la place
     au titre et au compteur, qui sont les deux seules informations utiles. */
  @media (max-width: 600px) {
    .caisse__head { gap: 10px; }
    .caisse__head img { display: none; }
    .caisse__head h1 { font-size: 1.1rem; }
    .caisse__head p { font-size: .74rem; }
    .pastille { padding: 4px 9px; font-size: .72rem; }
    .cmd { padding: 14px 13px; }
    .cmd__head { row-gap: 6px; }
    .cmd__heure { font-size: 1.2rem; }
    .cmd__pied .btn { flex: 1 1 auto; }
  }
</style>
</head>
<body>

<!-- ------------------------------------------------------- connexion -->
<section class="connexion" id="connexion" hidden>
  <span class="medallion" aria-hidden="true">🧾</span>
  <h1 style="font-size:1.6rem">Commandes du jour</h1>
  <p class="text-soft">Page réservée au restaurant.</p>
  <form id="form-connexion">
    <div class="field" data-field="mdp">
      <label for="mdp">Mot de passe</label>
      <input type="password" id="mdp" autocomplete="current-password" required>
      <p class="field__error"></p>
    </div>
    <button type="submit" class="btn btn--block btn--lg">Entrer</button>
  </form>
  <p style="margin-top:22px"><a href="index.html" class="text-soft" style="text-decoration:underline">Retour au site</a></p>
</section>

<!-- ------------------------------------------------------- écran caisse -->
<main class="caisse" id="ecran" hidden>
  <header class="caisse__head">
    <img src="assets/img/logo.png" alt="" width="42" height="42">
    <div style="flex:1;min-width:0">
      <h1>Commandes</h1>
      <p id="etat-maj">—</p>
    </div>
    <span class="pastille" id="pastille"><span class="pastille__point"></span><span id="pastille-txt">—</span></span>
    <button type="button" class="btn btn--ghost btn--sm" id="deconnexion">Quitter</button>
  </header>

  <div class="onglets" role="group" aria-label="Filtrer les commandes">
    <button type="button" data-filtre="actives" aria-pressed="true">À traiter</button>
    <button type="button" data-filtre="jour" aria-pressed="false">Tout aujourd’hui</button>
    <button type="button" data-filtre="tout" aria-pressed="false">Historique</button>
    <button type="button" class="btn btn--ghost btn--sm" id="son" style="margin-left:auto" aria-pressed="false">🔔 Son</button>
  </div>

  <div id="liste"></div>
  <p class="text-soft" style="text-align:center;font-size:.8rem;margin-top:26px">
    Actualisation automatique toutes les 20 secondes.
    <a href="admin.html" style="text-decoration:underline">Ruptures du jour →</a>
  </p>
</main>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var CLE_SESSION = 'dilemme.admin.mdp';   // partagée avec la page des ruptures
  var API = '/api/commandes';
  var DELAI = 20000;

  var etat = { commandes: [], filtre: 'actives', son: false, connues: null };

  function motDePasse() {
    try { return sessionStorage.getItem(CLE_SESSION); } catch (e) { return null; }
  }
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function euro(n) {
    return (Math.round(Number(n) * 100) / 100).toFixed(2).replace('.', ',') + ' €';
  }
  function heureCourte(iso) {
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }
  function debutDeJournee() {
    var d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString();
  }

  /* --------------------------------------------------------- affichage */
  var ETIQ = {
    nouvelle: ['etiq--alerte', 'Nouvelle'],
    vue: ['', 'En préparation'],
    prete: ['', 'Prête'],
    annulee: ['etiq--muet', 'Annulée'],
  };

  function carte(c) {
    var e = ETIQ[c.statut] || ETIQ.nouvelle;
    var lignes = (c.lignes || []).map(function (l) {
      var opts = (l.summary || []).map(function (s) { return '<span>' + esc(s) + '</span>'; }).join('');
      return '<li><span class="cmd__qte">' + esc(l.qty) + '×</span>' + esc(l.name)
        + (opts ? '<div class="cmd__opts">' + opts + '</div>' : '') + '</li>';
    }).join('');

    return '<article class="cmd cmd--' + esc(c.statut) + '">'
      + '<div class="cmd__head">'
      +   '<span class="cmd__ref">' + esc(c.reference) + '</span>'
      +   '<span class="etiq ' + e[0] + '">' + e[1] + '</span>'
      +   (c.whatsapp ? '' : '<span class="etiq etiq--muet" title="Le client n’a pas ouvert WhatsApp">sans WhatsApp</span>')
      +   '<span class="cmd__heure">' + esc(c.retrait && c.retrait.heure) + '</span>'
      + '</div>'
      + '<p class="cmd__client">'
      +   esc(c.client && c.client.nom) + ' · <a href="tel:' + esc((c.client && c.client.tel || '').replace(/\s/g, '')) + '">'
      +   esc(c.client && c.client.tel) + '</a>'
      +   ' · retrait ' + esc(c.retrait && c.retrait.jour)
      +   (c.retrait && c.retrait.desQuePossible ? ' (dès que possible)' : '')
      +   ' · reçue à ' + heureCourte(c.creeLe)
      + '</p>'
      + (c.client && c.client.note ? '<p class="cmd__note">📝 ' + esc(c.client.note) + '</p>' : '')
      + '<ul class="cmd__lignes">' + lignes + '</ul>'
      + '<div class="cmd__pied">'
      +   '<span class="cmd__total">' + euro(c.total)
      +   (c.remise > 0 ? ' <span class="text-soft" style="font-weight:400">(code ' + esc(c.promo) + ')</span>' : '')
      +   '</span>'
      +   boutons(c)
      + '</div>'
      + '</article>';
  }

  function boutons(c) {
    var b = '';
    if (c.statut === 'nouvelle') b += bouton(c.reference, 'vue', 'Je prépare', '');
    if (c.statut === 'vue') b += bouton(c.reference, 'prete', 'Prête', '');
    if (c.statut === 'prete') b += bouton(c.reference, 'vue', 'Rouvrir', 'btn--ghost');
    if (c.statut !== 'annulee') b += bouton(c.reference, 'annulee', 'Annuler', 'btn--ghost');
    else b += bouton(c.reference, 'nouvelle', 'Rétablir', 'btn--ghost');
    return b;
  }
  function bouton(ref, statut, libelle, classe) {
    return '<button type="button" class="btn btn--sm ' + classe + '" data-ref="'
      + esc(ref) + '" data-statut="' + statut + '">' + libelle + '</button>';
  }

  function visibles() {
    var jour = debutDeJournee();
    if (etat.filtre === 'actives') {
      return etat.commandes.filter(function (c) {
        return c.statut === 'nouvelle' || c.statut === 'vue';
      });
    }
    if (etat.filtre === 'jour') {
      return etat.commandes.filter(function (c) { return c.creeLe >= jour; });
    }
    return etat.commandes;
  }

  function afficher() {
    var liste = visibles();
    $('#liste').innerHTML = liste.length
      ? liste.map(carte).join('')
      : '<p class="vide">Aucune commande à afficher.</p>';

    var nouvelles = etat.commandes.filter(function (c) { return c.statut === 'nouvelle'; }).length;
    $('#pastille-txt').textContent = nouvelles
      ? nouvelles + (nouvelles > 1 ? ' nouvelles' : ' nouvelle')
      : 'à jour';
    $('#pastille').classList.toggle('pastille--alerte', nouvelles > 0);
    document.title = (nouvelles ? '(' + nouvelles + ') ' : '') + 'Commandes du jour — Dilemme';
  }

  /* ------------------------------------------------------------ signal */
  function sonnerie() {
    if (!etat.son) return;
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18].forEach(function (retard) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = retard ? 1046 : 784;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + retard);
        g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + retard + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + retard + 0.16);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + retard); o.stop(ctx.currentTime + retard + 0.18);
      });
    } catch (e) { /* le navigateur refuse le son : l'affichage suffit */ }
  }

  /* ------------------------------------------------------------ réseau */
  async function charger() {
    try {
      var r = await fetch(API + '?depuis=' + encodeURIComponent(debutDeJournee()), {
        headers: { Authorization: 'Bearer ' + motDePasse() },
        cache: 'no-store',
      });
      if (r.status === 401) { deconnecter(); return; }
      var data = await r.json();
      if (!r.ok) throw new Error(data.erreur || 'Erreur ' + r.status);

      etat.commandes = (data.commandes || []).sort(function (a, b) {
        return (b.creeLe || '').localeCompare(a.creeLe || '');
      });

      /* Une commande jamais vue déclenche la sonnerie ; au premier
         chargement on se contente de mémoriser ce qui est déjà là. */
      var refs = etat.commandes.filter(function (c) { return c.statut === 'nouvelle'; })
        .map(function (c) { return c.reference; });
      if (etat.connues === null) etat.connues = refs.slice();
      else {
        var inedites = refs.filter(function (ref) { return etat.connues.indexOf(ref) === -1; });
        if (inedites.length) sonnerie();
        etat.connues = refs.slice();
      }

      $('#etat-maj').textContent = 'Mis à jour à ' + heureCourte(new Date().toISOString());
      afficher();
    } catch (err) {
      $('#etat-maj').textContent = 'Connexion perdue — nouvelle tentative dans 20 s';
    }
  }

  async function changerStatut(reference, statut) {
    try {
      var r = await fetch(API + '?action=statut', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + motDePasse() },
        body: JSON.stringify({ reference: reference, statut: statut }),
      });
      if (!r.ok) throw new Error('refus');
      var data = await r.json();
      etat.commandes = etat.commandes.map(function (c) {
        return c.reference === reference ? data.commande : c;
      });
      etat.connues = etat.commandes.filter(function (c) { return c.statut === 'nouvelle'; })
        .map(function (c) { return c.reference; });
      afficher();
    } catch (err) {
      alert('Le changement n’a pas pu être enregistré. Réessayez.');
    }
  }

  /* ------------------------------------------------------------ liaison */
  $('#liste').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ref]');
    if (!b) return;
    if (b.dataset.statut === 'annulee' && !confirm('Annuler cette commande ?')) return;
    changerStatut(b.dataset.ref, b.dataset.statut);
  });

  document.querySelectorAll('.onglets button[data-filtre]').forEach(function (b) {
    b.addEventListener('click', function () {
      etat.filtre = b.dataset.filtre;
      document.querySelectorAll('.onglets button[data-filtre]').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      afficher();
    });
  });

  $('#son').addEventListener('click', function () {
    etat.son = !etat.son;
    $('#son').setAttribute('aria-pressed', String(etat.son));
    $('#son').textContent = etat.son ? '🔔 Son activé' : '🔕 Son coupé';
    if (etat.son) sonnerie();       // confirme au passage que le son sort
  });

  function deconnecter() {
    try { sessionStorage.removeItem(CLE_SESSION); } catch (e) {}
    location.reload();
  }
  $('#deconnexion').addEventListener('click', deconnecter);

  function ouvrir() {
    $('#connexion').hidden = true;
    $('#ecran').hidden = false;
    charger();
    setInterval(charger, DELAI);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) charger();
    });
  }

  /* La page ne protège rien à elle seule : c'est le serveur qui refuse la
     lecture sans mot de passe. */
  $('#form-connexion').addEventListener('submit', async function (e) {
    e.preventDefault();
    var champ = $('#mdp');
    var conteneur = document.querySelector('[data-field="mdp"]');
    conteneur.classList.remove('has-error');
    try {
      var r = await fetch(API, { headers: { Authorization: 'Bearer ' + champ.value } });
      var data = await r.json();
      if (r.status === 401) throw new Error('Mot de passe incorrect.');
      if (!r.ok) throw new Error(data.erreur || 'Erreur ' + r.status);
      sessionStorage.setItem(CLE_SESSION, champ.value);
      ouvrir();
    } catch (err) {
      conteneur.classList.add('has-error');
      conteneur.querySelector('.field__error').textContent = err.message;
    }
  });

  if (motDePasse()) ouvrir();
  else $('#connexion').hidden = false;
})();
</script>
</body>
</html>
